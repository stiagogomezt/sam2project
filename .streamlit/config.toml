[server]
headless = true

[theme]
base = "light"
primaryColor = "#0F5E63"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF3F7"
textColor = "#0F172A"
borderColor = "#CBD5E1"
baseRadius = "0.5rem"
buttonRadius = "0.45rem"
showWidgetBorder = true
showSidebarBorder = true
font = "sans serif"

[theme.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#CBD5E1"

[theme.dark]
primaryColor = "#0F766E"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#131C31"
textColor = "#F1F5F9"
borderColor = "#334155"
baseRadius = "0.5rem"
buttonRadius = "0.45rem"
showWidgetBorder = true

[theme.dark.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"

